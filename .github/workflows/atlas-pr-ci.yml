name: Atlas PR CI

on:
  pull_request:
    paths:
      - migrations/**
      - schema.hcl
      - atlas.hcl
      - scripts/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas -d atlas_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ATLAS_VERSION: v1.2.0
      ATLAS_DEV_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas_dev?sslmode=disable&search_path=public
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pinned Atlas CLI
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSf https://atlasgo.sh | ATLAS_VERSION="${ATLAS_VERSION}" CI=true sh -s -- --no-install -o "${RUNNER_TEMP}/bin/atlas"
          chmod +x "${RUNNER_TEMP}/bin/atlas"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Validate branch migration history
        run: |
          set -euo pipefail
          atlas migrate validate --dir "file://${PWD}/migrations" --dev-url "${ATLAS_DEV_URL}"
          atlas migrate diff pr_verify_no_drift \
            --dir "file://${PWD}/migrations" \
            --to "file://${PWD}/schema.hcl" \
            --dev-url "${ATLAS_DEV_URL}"
          if [[ -n $(git status --porcelain -- migrations) ]]; then
            echo "Schema changes require a committed Atlas migration." >&2
            git status --short -- migrations
            exit 1
          fi

      - name: Test coordinator logic
        run: make test
