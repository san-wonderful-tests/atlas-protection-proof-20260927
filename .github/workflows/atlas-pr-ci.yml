name: Atlas PR CI

on:
  pull_request:
    paths:
      - migrations/**
      - migrations_aux/**
      - schema.hcl
      - schema_aux.hcl
      - atlas.hcl
      - scripts/**

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas -d atlas_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ATLAS_VERSION: v1.2.0
      ATLAS_DEV_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas_dev?sslmode=disable&search_path=public
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Install pinned Atlas CLI
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSf https://atlasgo.sh | ATLAS_VERSION="${ATLAS_VERSION}" CI=true sh -s -- --no-install -o "${RUNNER_TEMP}/bin/atlas"
          chmod +x "${RUNNER_TEMP}/bin/atlas"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Validate branch migration history
        run: |
          set -euo pipefail
          for entry in 'migrations schema.hcl' 'migrations_aux schema_aux.hcl'; do
            read -r migration_dir schema_file <<<"${entry}"
            atlas migrate validate --dir "file://${PWD}/${migration_dir}" --dev-url "${ATLAS_DEV_URL}"
            atlas migrate diff pr_verify_no_drift \
              --dir "file://${PWD}/${migration_dir}" \
              --to "file://${PWD}/${schema_file}" \
              --dev-url "${ATLAS_DEV_URL}"
          done
          if [[ -n $(git status --porcelain -- migrations migrations_aux) ]]; then
            echo "Schema changes require a committed Atlas migration." >&2
            git status --short -- migrations migrations_aux
            exit 1
          fi

      - name: Test coordinator logic
        run: make test
