name: Migration Coordinator

on:
  pull_request_target:
    types: [labeled, ready_for_review, reopened]
  push:
    branches: [main]
    paths:
      - migrations/**
      - migrations_aux/**
      - schema.hcl
      - schema_aux.hcl
      - atlas.hcl
      - .github/workflows/migration-coordinator.yml
      - .github/workflows/finalized-ci.yml
      - scripts/process-ready-migration-prs.sh
      - scripts/finalize-migration-pr.sh
      - scripts/wait-finalized-ci.sh
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# GitHub retains only one pending run in a concurrency group. Each surviving
# worker scans all ready PRs, so cancelled label events cannot drop work.
concurrency:
  group: atlas-migration-coordinator
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  finalize:
    if: >-
      github.event_name != 'pull_request_target' ||
      github.event.action != 'labeled' ||
      github.event.label.name == 'db-ready'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas -d atlas_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ATLAS_VERSION: v1.2.0
      ATLAS_DEV_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas_dev?sslmode=disable&search_path=public
      ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout trusted coordinator from main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout candidate workspace
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: candidate
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install pinned Atlas CLI
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSf https://atlasgo.sh | ATLAS_VERSION="${ATLAS_VERSION}" CI=true sh -s -- --no-install -o "${RUNNER_TEMP}/bin/atlas"
          chmod +x "${RUNNER_TEMP}/bin/atlas"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Configure coordinator identity
        working-directory: candidate
        run: |
          git config user.name 'atlas-coordinator[bot]'
          git config user.email 'atlas-coordinator[bot]@users.noreply.github.com'

      - name: Process every ready migration PR
        working-directory: candidate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ../trusted/scripts/process-ready-migration-prs.sh
