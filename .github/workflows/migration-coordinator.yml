name: Migration Coordinator

on:
  pull_request_target:
    types: [labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to finalize
        required: true
        type: number

concurrency:
  group: atlas-migration-coordinator
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  statuses: write

jobs:
  finalize:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.label.name == 'db-ready'
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_dev
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U atlas -d atlas_dev"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ATLAS_VERSION: v1.2.0
      ATLAS_DEV_URL: postgres://atlas:atlas@127.0.0.1:5432/atlas_dev?sslmode=disable&search_path=public
      ATLAS_TOKEN: ${{ secrets.ATLAS_TOKEN }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Resolve pull request metadata
        id: pr
        env:
          REPOSITORY: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          set -euo pipefail
          pr_number=${INPUT_PR:-${EVENT_PR}}
          metadata=$(gh api "repos/${REPOSITORY}/pulls/${pr_number}")
          head_repo=$(jq -r '.head.repo.full_name' <<<"${metadata}")
          if [[ "${head_repo}" != "${REPOSITORY}" ]]; then
            echo "Fork pull requests are intentionally unsupported by this privileged lab workflow." >&2
            exit 1
          fi
          echo "number=${pr_number}" >>"${GITHUB_OUTPUT}"
          echo "head_ref=$(jq -r '.head.ref' <<<"${metadata}")" >>"${GITHUB_OUTPUT}"

      - name: Checkout trusted coordinator from main
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: main
          path: trusted
          persist-credentials: false

      - name: Checkout candidate branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ steps.pr.outputs.head_ref }}
          path: candidate
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Install pinned Atlas CLI
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/bin"
          curl -sSf https://atlasgo.sh | ATLAS_VERSION="${ATLAS_VERSION}" CI=true sh -s -- --no-install -o "${RUNNER_TEMP}/bin/atlas"
          chmod +x "${RUNNER_TEMP}/bin/atlas"
          echo "${RUNNER_TEMP}/bin" >>"${GITHUB_PATH}"

      - name: Configure coordinator identity
        working-directory: candidate
        run: |
          git config user.name 'atlas-coordinator[bot]'
          git config user.email 'atlas-coordinator[bot]@users.noreply.github.com'

      - name: Finalize and merge
        working-directory: candidate
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: ../trusted/scripts/finalize-migration-pr.sh '${{ steps.pr.outputs.number }}' '${{ steps.pr.outputs.head_ref }}'
